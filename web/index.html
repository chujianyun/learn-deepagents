<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DeepSeek - 探索未至之境</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/github.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- 鲸鱼 Logo（复用模板） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="whale-logo">
        <path d="M10 36c0-12.7 10.3-23 23-23 11.6 0 21.2 8.6 22.8 19.8l5.4-4.2c1.7-1.3 4.1.3 3.5 2.4l-2.6 8.6c-.5 1.7-2.5 2.4-3.9 1.3l-3.2-2.4C52.6 47.6 43.9 53 34 53c-13 0-24-7-24-17z" fill="#4D6BFE"/>
        <path d="M13 42c4.8 6.4 12.6 10 21 10 8.6 0 16.3-3.7 20.8-10.2-5.9 3.4-13 5.2-20.6 5.2-7.9 0-15.3-1.9-21.2-5z" fill="#EAF0FF"/>
        <circle cx="21.5" cy="31.5" r="3" fill="#fff"/>
        <circle cx="22.3" cy="31.2" r="1.4" fill="#1E2A5E"/>
        <path d="M31 44c2.6 2.6 6.6 3.4 10 2-1.4 2.6-4.6 4-7.8 3.2-1.6-.4-2.6-2.6-2.2-5.2z" fill="#3D5BE8"/>
      </g>
    </defs>
  </svg>

  <div id="app" class="app">
    <!-- ======= 侧边栏 ======= -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <svg class="logo-whale" viewBox="0 0 64 64" aria-hidden="true"><use href="#whale-logo"/></svg>
          <span class="logo-text">DeepSeek</span>
        </div>
        <button id="sidebarCollapseBtn" class="icon-btn" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24"><path d="M9 6l-5 6 5 6M20 6v12M4 12h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"/><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 4.5v15M15 9.5l-2.5 2.5 2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button id="newChatBtn" class="new-chat-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5H7a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-4M18.4 4.6a2 2 0 0 1 2.8 2.8L13 15.6l-3.7.9.9-3.7 8.2-8.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>开启新对话</span>
      </button>

      <nav id="history" class="history" aria-label="历史对话"></nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">悟</div>
          <div class="user-meta">
            <span class="user-name">悟鸣</span>
            <span class="user-sub">本地智能体工作台</span>
          </div>
          <span class="local-badge" title="服务运行在本机 127.0.0.1">本地</span>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- ======= 主区域 ======= -->
    <main class="main">
      <header class="topbar">
        <button id="sidebarOpenBtn" class="icon-btn" title="展开侧边栏" aria-label="展开侧边栏">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 4.5v15M13 9.5l2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="model-picker">
          <button id="modelBtn" class="model-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="modelBtnName">DeepSeek-V4.1-Flash</span>
            <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="topbar-spacer"></div>
        <button id="topNewChatBtn" class="icon-btn" title="开启新对话" aria-label="开启新对话">
          <svg viewBox="0 0 24 24"><path d="M11 5H7a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-4M18.4 4.6a2 2 0 0 1 2.8 2.8L13 15.6l-3.7.9.9-3.7 8.2-8.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div id="chatScroll" class="chat-scroll">
        <div id="welcome" class="welcome">
          <div class="welcome-title">
            <svg class="welcome-whale" viewBox="0 0 64 64" aria-hidden="true"><use href="#whale-logo"/></svg>
            <span>我是 DeepSeek，很高兴见到你！</span>
          </div>
          <p class="welcome-sub">我可以帮你写代码、读文件、写作各种创意内容，请把你的任务交给我吧~</p>
        </div>
        <div id="messages" class="messages" hidden></div>
      </div>

      <div class="composer-area">
        <button id="scrollBottomBtn" class="scroll-bottom-btn" hidden title="回到底部" aria-label="回到底部">
          <svg viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div id="composerBox" class="composer">
          <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息" aria-label="消息输入框"></textarea>
          <div class="composer-actions">
            <div class="pills">
              <button id="searchToggle" class="pill" aria-pressed="false" title="开启后，模型可联网搜索最新信息">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5s1.2-6.2 3.6-8.5z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                <span>联网搜索</span>
              </button>
              <div id="enhanceRestore" class="enhance-restore" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span>提示词已增强</span>
                <button id="enhanceRestoreBtn" class="enhance-restore-btn" type="button">还原</button>
              </div>
            </div>
            <div class="composer-right">
              <button id="enhanceBtn" class="enhance-btn" type="button" aria-label="提示词增强" data-tooltip="提示词增强">
                <svg class="icon-sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span class="enhance-spinner" hidden></span>
              </button>
              <button id="sendBtn" class="send-btn" disabled title="发送" aria-label="发送">
                <svg class="icon-send" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="icon-stop" viewBox="0 0 24 24" hidden><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="disclaimer">内容由 AI 生成，请仔细甄别</div>
      </div>
    </main>
  </div>

  <!-- 模型选择菜单（JS 填充） -->
  <div id="modelMenu" class="model-menu" role="listbox" hidden></div>

  <!-- 删除确认弹窗 -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle">删除该对话？</div>
      <div class="modal-body">删除后，该对话记录将无法恢复。</div>
      <div class="modal-actions">
        <button id="modalCancel" class="modal-btn">取消</button>
        <button id="modalConfirm" class="modal-btn danger">删除</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
